# ---------------------------------------------------------------------------
# Mapeo del modelo de datos de CNEL EP (SIGELEC / ArcFM) al modelo canónico.
#
# Jerarquía real de CNEL (confirmada en las relationship classes):
#
#   ESTRUCTURA (soporte físico)            EstructuraSoporte / EstructuraANivel /
#     │                                     EstructuraSubterranea
#     ├── PUESTO (agrupación funcional)    PuestoTransfDistribucion, PuestoSeccionador,
#     │     └── UNIDAD (equipo con placa)  UNIDADTRANSFDISTRIBUCION, UNIDADFUSIBLE, ...
#     │
#     └── PUNTO DE CARGA                   PuntoCarga  (1 por edificio/predio)
#           └── CONEXIÓN CONSUMIDOR        CONEXIONCONSUMIDOR  (N medidores por punto)
#
# El vínculo puesto→unidad y puntoCarga→conexión es por GLOBALID (PK) contra el
# campo <PADRE>GLOBALID (FK) del hijo. La conectividad de red usa el par
# CIRCUITSOURCEGUID (padre) / PARENTCIRCUITSOURCEGUID (hijo) de ArcFM.
# ---------------------------------------------------------------------------

# Campo con el identificador de alimentador (presente en casi todas las capas).
feeder_field: ALIMENTADORID

# --- Jerarquía: qué capa es padre de cuál y por qué claves ---------------
hierarchy:
  # PUESTO -> UNIDAD (1:N). Clave: GLOBALID del puesto = <FK> de la unidad.
  site_units:
    transformer:
      site_layer: PuestoTransfDistribucion
      unit_layer: UNIDADTRANSFDISTRIBUCION
      unit_fk: PUESTOTRANSFDISTGLOBALID
    switch_fuse:
      site_layer: PuestoSeccionadorFusible
      unit_layer: UNIDADFUSIBLE
      unit_fk: PUESTOSECFUSIBLEGLOBALID
    protection_dynamic:
      site_layer: PuestoProteccionDinamico
      unit_layer: UNIDADPROTECCIONDINAMICO
      unit_fk: PUESTOPROTDINAMGLOBALID
    voltage_regulator:
      site_layer: PuestoReguladorTension
      unit_layer: UNIDADREGULADORTENSION
      unit_fk: PUESTOREGTENSGLOBALID
    capacitor:
      site_layer: PuestoCorrectorFactorPotencia
      unit_layer: UNIDADCAPACITOR
      unit_fk: PUESTOCORRFACPOTGLOBALID
    lv_protection:
      site_layer: PuestoProteccionBajaTension
      unit_layer: UNIDADPROTECCIONBAJATENSION
      unit_fk: PUESTOPROTECCIONBTGLOBALID

  # PUNTO DE CARGA -> CONEXIONES CONSUMIDOR (1:N). El caso del edificio.
  load_point:
    layer: PuntoCarga
    connection_layer: CONEXIONCONSUMIDOR
    connection_fk: PUNTOCARGAGLOBALID
    # el punto de carga cuelga de un puesto de transformación
    transformer_fk: PUESTOTRANSFDISTGLOBALID

  # ESTRUCTURA (soporte) -> puestos y puntos de carga. Tres tipos de soporte;
  # cada hijo trae los tres campos y solo uno viene informado.
  structures:
    layers: [EstructuraSoporte, EstructuraANivel, EstructuraSubterranea]
    child_fks:
      EstructuraSoporte: ESTRUCTURASOPORTEGLOBALID
      EstructuraANivel: ESTRUCTURANIVELGLOBALID
      EstructuraSubterranea: ESTRUCTURASUBTERRANEAGLOBALID

  # Conectividad de red de ArcFM (traza padre-hijo).
  circuit_trace:
    parent_key: CIRCUITSOURCEGUID
    child_key: PARENTCIRCUITSOURCEGUID

# --- Mapeo de campos por entidad canónica --------------------------------
layers:
  poles:                       # canónico 'poles' = ESTRUCTURA de soporte
    layer: EstructuraSoporte
    fields:
      pole_id: GLOBALID
      pole_type: TIPOESTRUCTURA
      height_m: ALTURA

  sites:                       # puestos de transformación
    layer: PuestoTransfDistribucion
    fields:
      site_id: GLOBALID
      site_code: CODIGOPUESTO
      pole_id: ESTRUCTURASOPORTEGLOBALID
      bank_config_raw: CONFIGURACIONLADOBAJA   # -> BankConfig (ver domains)
      phase_raw: FASECONEXION                  # -> Phase (ver domains)
      voltage_mv: VOLTAJE
      declared_kva: POTENCIAKVA
      metered: MEDIDO
      node_id: CIRCUITSOURCEGUID
      subtype_raw: SUBTIPO
    # SUBTIPO de PuestoTransfDistribucion (verificado por el cliente): describe
    # el tipo físico de instalación (mono/bi/trifásico, integral vs. banco de
    # 2/3 unidades). Es una señal MÁS confiable que CONFIGURACIONLADOBAJA sola
    # (que ya se vio con valores inconsistentes) y se usa para reconciliar
    # bank_config junto con el conteo real de unidades (§5.2).
    subtype_domain:
      1: {phases: 1, kind: single}              # Transformador Monofásico en Poste
      2: {phases: 1, kind: single}              # Transformador Monofásico en Cabina
      3: {phases: 1, kind: single}              # Padmounted Monofásico Exterior
      4: {phases: 1, kind: single}              # Padmounted Monofásico en Cabina
      5: {phases: 3, kind: integral_3ph}        # Transformador Trifásico en Poste
      6: {phases: 3, kind: integral_3ph}        # Transformador Trifásico en Cabina
      7: {phases: 3, kind: integral_3ph}        # Padmounted Trifásico Exterior
      8: {phases: 3, kind: integral_3ph}        # Padmounted Trifásico en Cabina
      9: {phases: 2, kind: bank2}                # Banco de 2 Transformadores en Poste
      10: {phases: 2, kind: bank2}               # Banco de 2 Transformadores en Cabina
      11: {phases: 3, kind: bank3}               # Banco de 3 Transformadores en Poste
      12: {phases: 3, kind: bank3}               # Banco de 3 Transformadores en Cabina
      13: {phases: 2, kind: biphase}             # Transformador Bifásico en Poste
      14: {phases: 2, kind: biphase}             # Transformador Bifásico en Cabina
      15: {phases: 2, kind: biphase}             # Padmounted Bifásico Exterior
      16: {phases: 2, kind: biphase}             # Padmounted Bifásico en Cabina

  transformer_units:           # unidades del banco
    layer: UNIDADTRANSFDISTRIBUCION
    fields:
      unit_id: GLOBALID
      site_id: PUESTOTRANSFDISTGLOBALID
      sn_kva: POTENCIANOMINAL                  # String con dominio -> numérico
      voltage_ln: TENSIONLADOALTA
      phase_raw: FASECONEXION
      serial: NUMEROSERIE
      brand: MARCA
      model: MODELO
      unit_type: TIPO
    # P0/Pk NO existen en la GDB: se toman del catálogo por kVA y se marca
    # plate_source='catalog' (§Anexo B punto 4).

  load_points:                 # PUNTO DE CARGA (el "edificio")
    layer: PuntoCarga
    fields:
      load_point_id: GLOBALID
      transformer_site_id: PUESTOTRANSFDISTGLOBALID
      pole_id: ESTRUCTURASOPORTEGLOBALID
      phase_raw: FASECONEXION
      reading_route: RUTALECTURA
      reading_sequence: SECUENCIALECTURA
      x: COORD_X
      y: COORD_Y

  customers:                   # CONEXION CONSUMIDOR = unidad de servicio (medidor)
    layer: CONEXIONCONSUMIDOR
    fields:
      # CODIGOUNICO es el IDENTIFICADOR ÚNICO de la conexión (no el GLOBALID):
      # es el que viaja al sistema comercial y el que une con ATRIBUTOSCONSUMIDOR.
      customer_unit_id: CODIGOUNICO
      global_id: GLOBALID                      # se conserva para trazabilidad SIG
      site_id: PUNTOCARGAGLOBALID              # su punto de carga (puesto)
      customer_code: CODIGOCLIENTE
      meter_serial: MDENUMFAB
      meter_brand: MEDMAR
      meter_type: TIPOMEDIDOR
      phase_raw: SECUENCIAFASE
      prepaid: PREPAGO
      status: ESTADO

  # Atributos comerciales del consumidor. Se une a CONEXIONCONSUMIDOR por
  # CODIGOUNICO y aporta la CUENTACONTRATO (identificador único comercial),
  # la clase tarifaria y la carga instalada, que no están en la capa gráfica.
  customer_attributes:
    layer: ATRIBUTOSCONSUMIDOR
    join_key: CODIGOUNICO
    fields:
      customer_unit_id: CODIGOUNICO
      cuenta_contrato: CUENTACONTRATO          # ID único del sistema comercial
      tariff_raw: TIPOTARIFA                   # -> tariff_class (dominio TipoTarifaCIS)
      category: CATEGORIA
      installed_load_kw: POTENCIAACTIVA
      installed_reactive_kvar: POTENCIAREACTIVA
      n_phases: CDAFAS
      service_status: EDCCOD
      meter_number: NUMMEDIDOR
      voltage_level: NIVTENSION
      avg_consumption: CONSUMOPROMEDIO
      last_month_kwh: CLIULTCONM
      agency: AGENCIA

  streetlights:
    layer: Luminaria
    fields:
      streetlight_id: GLOBALID
      pole_id: ESTRUCTURASOPORTEGLOBALID
      transformer_site_id: PARENTCIRCUITSOURCEGUID
      phase_raw: FASECONEXION
      lamp_w: POTENCIA
      technology_raw: SUBTIPO
    # Dominio real de SUBTIPO en Luminaria (verificado por el cliente): tecnología
    # de lámpara -> categorías de config/streetlight.yaml. Se usa 'led' como
    # default solo si el código no aparece aquí.
    technology_domain:
      1: mercury            # Mercurio Cerrada
      2: mercury            # Mercurio Abierta
      3: sodium              # Sodio Abierta
      4: sodium              # Sodio Cerrada
      5: led                 # LED
      6: sodium              # Proyector Sodio
      7: mercury            # Proyector Mercurio
      9: induction            # Inducción
      10: metal_halide        # Proyector Metal Halide
      11: metal_halide        # Metal Halide
      12: led                 # Proyector LED
    technology_default: led

  switching_devices:
    layer: PuestoProteccionDinamico
    fields:
      device_id: GLOBALID
      node_id: CIRCUITSOURCEGUID
      pole_id: ESTRUCTURASOPORTEGLOBALID
      phase_raw: FASECONEXION

  # Tramos de red (media/baja tensión, aéreo y subterráneo). No traen
  # node_from/node_to explícitos: se derivan de los extremos de la geometría
  # de línea (snapping por coordenada) al momento de la ingesta.
  segments:
    layers: [TramoDistribucionAereo, TramoDistribucionSubterraneo,
             TramoBajaTensionAereo, TramoBajaTensionSubterraneo]
    fields:
      segment_id: GLOBALID
      conductor_code: CODIGOCONDUCTORFASE
      neutral_code: CODIGOCONDUCTORNEUTRO
      voltage_ll: VOLTAJE
      phase_raw: FASECONEXION
      length_field: LONGITUDSISTEMA
      parent_circuit_guid: PARENTCIRCUITSOURCEGUID

# --- Decodificación de dominios ------------------------------------------
# IMPORTANTE: el diccionario entregado lista los NOMBRES de dominio pero no sus
# valores. Aquí van los del estándar ArcFM; VERIFICAR contra los dominios reales
# de la GDB con `lossan cnel-domains <gdb>` y ajustar si difieren.
domains:
  # 'Phase Designation' de ArcFM: bitmask C=1, B=2, A=4.
  phase_designation:
    1: C
    2: B
    3: BC
    4: A
    5: AC
    6: AB
    7: ABC

  # 'Config Lado Baja Banco Transf' -> configuración de banco (§5.2).
  # VERIFICADO contra el dominio real de la GDB con
  # `ogrinfo <gdb> -fielddomain "Config Lado Baja Banco Transf"` (no es el
  # estándar ArcFM genérico: CNEL usa códigos cortos propios).
  # Las claves se comparan en mayúsculas y sin espacios.
  bank_config:
    L: single            # Linea Monofasica
    Y: wye_closed         # Estrella
    YA: open_wye_open_delta  # Estrella Abierta (banco de 2 unidades) — VERIFICAR con campo
    DE: delta_closed      # Delta
    DT: delta_4wire        # Delta Aterrado (delta 4 hilos con neutro)
    D: open_delta          # Delta Abierta
    # equivalentes largos por si otra capa trae el texto en vez del código:
    MONOFASICO: single
    MONOFASICA: single
    SIMPLE: single
    ESTRELLA: wye_closed
    ESTRELLACERRADA: wye_closed
    DELTA: delta_closed
    DELTAATERRADO: delta_4wire
    DELTAABIERTA: open_delta
    ESTRELLAABIERTA: open_wye_open_delta
    INDEPENDIENTE: independent

  # Estado de la conexión consumidor que cuenta como servicio activo.
  active_status_values: [1, "1", "ACTIVO", "A"]

  # 'TipoTarifaCIS' -> clase tarifaria canónica. VERIFICADO contra el dominio
  # real de la GDB (`ogrinfo <gdb> -fielddomain TipoTarifaCIS`): CNEL usa
  # códigos alfanuméricos propios (p. ej. BTCRSD01O), no los nombres largos
  # genéricos de ArcFM. Clasificado por palabra clave en la descripción del
  # dominio (RESIDENCIAL/COMERCIAL/INDUSTRIAL/ALUMBRADO); el resto de
  # categorías (bombeo, entidades oficiales, asistencia social, etc.) cae en
  # 'commercial' como catch-all no residencial.
  tariff_class:
    ATCGCD03O: commercial   # AT Abonados Especiales con Dem Hor PO
    ATCGCD04O: commercial   # AT Bombeo de Agua con Dem Horaria PO
    ATCGCD07O: industrial   # AT Industrial con Dem Hor Dif PO
    ATCGCD08O: commercial   # AT Servicio Comunitario con Dem Hor PO
    ATCGCD09O: commercial   # AT Comercial con Demanda Horaria PO
    ATCGCD10O: commercial   # AT Entidades Oficiales con Dem Hor PO
    ATCGCD11O: commercial   # AT Escenarios Deportivos con Dem Hor PO
    ATCGCD12O: commercial   # AT Autoconsumo con Demanda Horaria PO
    ATCGCD13O: commercial   # AT Bombeo de agua S.P. agua pot. dem hor
    ATPDIS01O: commercial   # AT Peajes de distribución
    BTAPCD01O: streetlight_led   # BT Alumbrado Público
    BTCGCD01O: commercial   # BT Comercial con Demanda PO
    BTCGCD02O: industrial   # BT Industrial con Demanda PO
    BTCGCD03O: commercial   # BT Asistencia Social con Demanda PO
    BTCGCD04O: commercial   # BT Autoconsumos con Demanda PO
    BTCGCD05O: commercial   # BT Beneficio Público con Demanda PO
    BTCGCD06O: commercial   # BT Bombeo de Agua con Demanda PO
    BTCGCD07O: commercial   # BT Entidades Oficiales con Demanda PO
    BTCGCD08O: commercial   # BT Escenarios Deportivos con Demanda PO
    BTCGCD11O: commercial   # BT Servicio Comunitario con Demanda PO
    BTCGCD20O: commercial   # BT Beneficio Público con Dem Horaria PO
    BTCGCD21O: commercial   # BT Bombeo de Agua Comu Campesinas Dem PO
    BTCGCD30O: industrial   # BT Industrial con Demanda Horaria PO
    BTCGCD31O: commercial   # BT Comercial con Demanda Horaria PO
    BTCGCD32O: commercial   # BT Culto Religioso con Demanda PO
    BTCGCD34O: commercial   # BT Bombeo de Agua con Dem Horaria PO
    BTCGCD35O: commercial   # BT Entidades Oficiales con Dem Hor PO
    BTCGCD36O: commercial   # BT Escenarios Deportivos con Dem Hor PO
    BTCGCD37O: commercial   # BT Autoconsumo con Demana Horaria PO
    BTCGCD39O: commercial   # BT Servicio Comunitario con Dem Hor PO
    BTCGCD40O: commercial   # BT Bombeo de agua S.P. agua pot. dem hor
    BTCGSD01O: commercial   # BT Comercial PO
    BTCGSD01P: commercial   # BT Comercial PR
    BTCGSD02O: industrial   # BT Industrial Artesanal PO
    BTCGSD03O: commercial   # BT Asistencia Social PO
    BTCGSD03P: commercial   # BT Asistencia Social PR
    BTCGSD04O: commercial   # BT Beneficio Público PO
    BTCGSD04P: commercial   # BT Beneficio Público PR
    BTCGSD05O: commercial   # BT Entidades Oficiales PO
    BTCGSD06O: commercial   # BT Abonados Especiales con Demanda PO
    BTCGSD09O: commercial   # BT Culto Religioso PO
    BTCGSD09P: commercial   # BT Culto Religioso PR
    BTCGSD10O: commercial   # BT Abonados Especiales con Dem Hor PO
    BTCGSD11O: commercial   # BT Servicio Comunitario PO
    BTCGSD11P: commercial   # BT Servicio Comunitario PR
    BTCGSD12O: commercial   # BT Escenarios Deportivos PO
    BTCGSD12P: commercial   # BT Escenarios Deportivos PR
    BTCGSD13O: commercial   # BT Bombeo de Agua PO
    BTCGSD13P: commercial   # BT Bombeo de Agua PR
    BTCGSD14O: commercial   # BT Bombeo de agua S.P. agua potable
    BTCRSD01F: residential   # BT Residencial
    BTCRSD01O: residential   # BT Residencial PO
    BTCRSD01P: residential   # BT Residencial PR
    BTCRSD02O: residential   # BT Residencial Temporal PO
    BTCRSD03O: residential   # BT Residencial para el Programa PEC PO
    DUMMY: commercial   # Tipo de tarifa DUMMY
    MTCGCD01O: commercial   # MT Comercial con Demanda PO
    MTCGCD02O: commercial   # MT Comercial con Demanda Horaria PO
    MTCGCD03O: industrial   # MT Industrial con Demanda PO
    MTCGCD05O: commercial   # MT Abonados Especiales con Demanda PO
    MTCGCD06O: commercial   # MT Abonados Especiales con Dem Hor PO
    MTCGCD07O: commercial   # MT Asistencia Social con Demanda PO
    MTCGCD08O: commercial   # MT Asistencia Social con Dem Horaria PO
    MTCGCD09O: commercial   # MT Beneficio Público con Demanda PO
    MTCGCD10O: commercial   # MT Beneficio Público con Dem Horaria PO
    MTCGCD11O: commercial   # MT Bombeo de Agua con Demanda PO
    MTCGCD12O: commercial   # MT Bombeo de Agua con Demanda Horaria PO
    MTCGCD13O: commercial   # MT Entidades Oficiales Con Demanda PO
    MTCGCD14O: commercial   # MT Entidades Oficiales Con Dem Hor PO
    MTCGCD15O: commercial   # MT Escenarios Deportivos con Demanda PO
    MTCGCD16O: commercial   # MT Escenarios Deportivos con Dem Hor PO
    MTCGCD30O: commercial   # MT Bombeo de Agua Comu Campesinas Dem PO
    MTCGCD31O: commercial   # Peajes de distribución PO
    MTCGCD32O: industrial   # MT Industrial con Dem Hor Dif PO
    MTCGCD33O: commercial   # MT Culto Religioso con Demanda PO
    MTCGCD34O: commercial   # MT Servicio Comunitario con Dem Hor PO
    MTCGCD35O: commercial   # MT Servicio Comunitario con Demanda PO
    MTCGCD36O: commercial   # MT Autoconsumo con Demanda Horaria PO
    MTCGCD37O: commercial   # MT Autoconsumo con Demanda PO
    MTCGCD39O: commercial   # MT Bombeo de agua S.P. agua pot. dem hor
    MTCRSD03O: residential   # MT Categoria Residencial PO
    MTCRSD03P: residential   # MT Categoría Residencial PR
    MTCRSD04O: residential   # MT Categoria Residencial Temporal PO
    NDCGCD01O: commercial   # BT  Asistencia Social con Dem Horaria PO
  tariff_class_default: commercial

# --- Cruce con el sistema comercial (consumo histórico) -------------------
# CUENTACONTRATO y CODIGOUNICO son los identificadores únicos. El histórico de
# consumo suele venir por CUENTACONTRATO; el SIG identifica por CODIGOUNICO.
commercial_join:
  primary_key: cuenta_contrato       # clave preferente en el sistema comercial
  fallback_key: customer_unit_id     # CODIGOUNICO si el consumo viene por él
